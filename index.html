<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guia da Bia">
<title>Guia Alimentar da Bia</title>
<style>
:root{--bg:#faf6f0;--cd:#fff;--ink:#2d2a26;--mut:#7a726a;--ac:#c2674a;--ac2:#f6e3da;--ok:#5b8a5a;--ln:#ece4da;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--cd:#27231f;--ink:#f1ebe4;--mut:#a39a90;--ac:#e08a6c;--ac2:#3a2a24;--ok:#86b985;--ln:#38322c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--cd:#27231f;--ink:#f1ebe4;--mut:#a39a90;--ac:#e08a6c;--ac2:#3a2a24;--ok:#86b985;--ln:#38322c;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:0 14px 90px;max-width:560px;margin:auto;-webkit-tap-highlight-color:transparent}
h1{font:600 22px Georgia,serif;margin:16px 0 2px}small,.mut{color:var(--mut);font-size:13px}
.hero{background:var(--ac2);border-radius:18px;padding:14px 16px;margin:10px 0}.hero p{margin:4px 0 0;font:italic 18px/1.35 Georgia,serif}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:12px;margin:10px 0}.card.done{opacity:.72}
.mh{display:flex;gap:12px;align-items:center;margin-bottom:8px}.mh b{display:block}
.chk{width:38px;height:38px;border-radius:50%;border:2px solid var(--ac);background:none;color:#fff;font-size:20px;flex:none}.done .chk{background:var(--ok);border-color:var(--ok)}
.ings{display:flex;flex-wrap:wrap;gap:8px}
.ing{font:inherit;font-size:14px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:20px;padding:8px 12px;display:inline-flex;gap:6px;align-items:center}
.ing span{color:var(--ac);font-weight:700}.ing.sw{border-color:var(--ac);background:var(--ac2)}.ing.fx{color:var(--mut)}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.btn{font:inherit;font-weight:600;border:0;background:var(--ac);color:#fff;border-radius:12px;padding:12px 16px}.btn.g{background:var(--ac2);color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1}
input{font:inherit;width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink)}
label{font-size:13px;color:var(--mut);display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 12px inherit;font-family:inherit;padding:6px}.tabs button.on{color:var(--ac)}.tabs b{display:block;font-size:22px}
#sh{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}#sh.on{display:flex}
#sh>div{background:var(--cd);width:100%;max-width:560px;margin:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:75vh;overflow:auto}
.op{display:flex;justify-content:space-between;width:100%;text-align:left;font:inherit;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--ink);padding:13px 4px}.op small{text-align:right}
.alert{background:var(--ac);color:#fff;border-radius:14px;padding:12px 14px;margin:10px 0}.alert button{margin-top:8px;background:#fff;color:var(--ac)}
.ent{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--ln);padding:10px 0}.ent img{width:54px;height:72px;object-fit:cover;border-radius:8px}.ent div{flex:1}
.wk{display:flex;gap:6px;align-items:flex-end;height:90px}.wk div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.wk i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:3px}
svg{width:100%;height:auto}
</style></head><body>
<div id="app"></div>
<div id="sh"><div id="shc"></div></div>
<nav class="tabs"><button data-t="hoje"><b>🍽️</b>Hoje</button><button data-t="agua"><b>💧</b>Água</button><button data-t="evo"><b>📈</b>Evolução</button></nav>
<script>
const G={
fruta:["Frutas",[["Banana","1 pequena (≈80 g)"],["Maçã","1 média (≈130 g)"],["Mamão","150 g"],["Melancia","250 g"],["Melão","250 g"],["Laranja","1 média"],["Pera","1 média"],["Abacaxi","150 g"],["Manga","100 g"],["Mexerica","2 pequenas"],["Morango","250 g"]]],
leite:["Leites e derivados",[["Iogurte natural desnatado","170 g"],["Leite desnatado","200 ml"],["Leite semidesnatado","180 ml"],["Leite integral","150 ml"],["Iogurte natural integral","120 g"],["Leite em pó desnatado","25 g do pó"],["Leite em pó integral","20 g do pó"],["Kefir natural","170 ml"]]],
carb:["Carboidratos",[["Cuscuz cozido","100 g"],["Arroz cozido","100 g"],["Batata inglesa cozida","170 g"],["Batata-doce cozida","130 g"],["Mandioca cozida","65 g"],["Inhame cozido","120 g"],["Macarrão cozido","100 g"],["Pão francês","½ unidade"],["Pão integral","2 fatias pequenas"],["Goma de tapioca","35 g"],["Aveia","30 g"],["Milho cozido","100 g"]]],
prot:["Proteínas (25–30 g de proteína)",[["Peito de frango pronto","100 g"],["Patinho moído magro pronto","110 g"],["Coxão mole magro pronto","110 g"],["Peixe branco pronto","130 g"],["Atum em água drenado","120 g"],["Lombo suíno magro pronto","120 g"],["2 ovos","12–13 g de proteína"],["3 ovos","18–20 g de proteína"],["2 ovos + 2 claras","19–21 g de proteína"],["3 ovos + 2 claras","25–27 g de proteína"]]],
feij:["Feijões e leguminosas",[["Feijão carioca cozido","100 g"],["Feijão preto cozido","100 g"],["Lentilha cozida","100 g"],["Ervilha cozida","100 g"],["Grão-de-bico cozido","70 g"],["Feijão-fradinho cozido","100 g"]]],
leg:["Legumes e verduras",[["Abobrinha","150–200 g"],["Chuchu","150–200 g"],["Brócolis","100–150 g"],["Couve-flor","150 g"],["Cenoura","100 g"],["Repolho","150 g"],["Vagem","150 g"],["Berinjela","150 g"],["Pepino","150 g"],["Tomate","150 g"],["Couve","100 g"]]],
gord:["Gorduras e complementos",[["Azeite","5 ml"],["Óleo de soja","5 ml"],["Manteiga","5 g"],["Margarina","5 g"],["Pasta de amendoim","10 g"],["Amendoim","10 g"],["Castanhas","10 g"],["Abacate","50 g"],["Chia","10 g"],["Linhaça","10 g"]]]};
Object.assign(G,{
fruta:["Frutas",[["Banana",90],["Maçã",55],["Mamão",40],["Melancia",30],["Melão",30],["Laranja",47],["Pera",57],["Abacaxi",50],["Manga",65],["Mexerica",45],["Morango",32]]],
leite:["Leites e derivados",[["Iogurte natural desnatado",40],["Leite desnatado",35,"ml"],["Leite semidesnatado",47,"ml"],["Leite integral",61,"ml"],["Iogurte natural integral",65],["Leite em pó desnatado (pó)",360],["Leite em pó integral (pó)",500],["Kefir natural",50,"ml"]]],
carb:["Carboidratos",[["Cuscuz cozido",113],["Arroz cozido",128],["Batata inglesa cozida",87],["Batata-doce cozida",86],["Mandioca cozida",125],["Inhame cozido",97],["Macarrão cozido",158],["Pão francês",300],["Pão integral",250],["Goma de tapioca",350],["Aveia",390],["Milho cozido",96]]],
gord:["Gorduras e complementos",[["Azeite",900,"ml"],["Óleo de soja",900,"ml"],["Manteiga",720],["Margarina",720],["Pasta de amendoim",590],["Amendoim",585],["Castanhas",600],["Abacate",160],["Chia",490],["Linhaça",530]]],
prot:["Proteínas (≈25–30 g de proteína)",[["Peito de frango pronto","100 g · ≈165 kcal"],["Patinho moído magro pronto","110 g · ≈240 kcal"],["Coxão mole magro pronto","110 g · ≈220 kcal"],["Peixe branco pronto","130 g · ≈155 kcal"],["Atum em água drenado","120 g · ≈130 kcal"],["Lombo suíno magro pronto","120 g · ≈240 kcal"],["2 ovos","12–13 g prot. · ≈140 kcal"],["3 ovos","18–20 g prot. · ≈210 kcal"],["2 ovos + 2 claras","19–21 g prot. · ≈175 kcal"],["3 ovos + 2 claras","25–27 g prot. · ≈245 kcal"]]]});
const M=[
{id:"cafe",h:"09h30",t:"Café da manhã",k:"≈280–330 kcal",i:[["carb","Cuscuz cozido","80 g",90],["prot","2 ovos",""],["fruta","Mamão","150 g",60],[0,"Café sem açúcar",""]]},
{id:"lm",h:"11h30",t:"Lanche da manhã",k:"≈130–170 kcal",i:[["fruta","Maçã","130 g",70],["leite","Iogurte natural desnatado","170 g",70]]},
{id:"alm",h:"13h30",t:"Almoço",k:"≈370–460 kcal",i:[["prot","Frango","130 g"],["carb","Arroz cozido","60 g",75],["feij","Feijão carioca cozido","100 g"],["leg","Legumes","200 g"],[0,"Salada à vontade",""],["gord","Azeite","5 ml",45]]},
{id:"lt",h:"16h30",t:"Lanche da tarde",k:"≈180–230 kcal",i:[["leite","Iogurte natural desnatado","170 g",70],["carb","Aveia","20 g",80],["fruta","Banana","80 g",70]]},
{id:"jan",h:"20h30",t:"Jantar",k:"≈310–410 kcal",i:[["prot","Carne moída magra","120 g"],["carb","Batata cozida","100 g",85],["leg","Legumes","300 g"],[0,"Salada à vontade",""]]}];
const Q=["Você não precisa acertar tudo hoje.","Precisa apenas continuar escolhendo cuidar de si.","Um passo de cada vez.","O objetivo não é a perfeição, é uma rotina que caiba na vida real.","Uma refeição fora do plano não estraga a semana. Retome sem punição.","Não é necessário fazer uma dieta extrema para cuidar da saúde.","Acompanhe a evolução por semanas, não por um único dia.","Comida de verdade, escolhas simples e liberdade para adaptar.","Constância vale mais que intensidade.","Cuidar de si é um ato de carinho, todos os dias."];
const K="guia-bia-v1";let S={days:{},water:{},goal:2000,log:[],altura:156,ideal:""},tab="hoje",foto="";
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert("Sem espaço para salvar. Remova fotos antigas na aba Evolução.")}};
const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const td=()=>ds(new Date());
const day=()=>S.days[td()]||(S.days[td()]={done:{},sub:{}});
const $=s=>document.querySelector(s);
const fmt=d=>d.split("-").reverse().slice(0,2).join("/");
function remind(){const l=S.log.length?S.log[S.log.length-1].d:null;
 const n=l?Math.floor((new Date(td())-new Date(l))/864e5):99;
 if(n>=14)return `<div class="alert"><b>Dia de check-in 💛</b><br>${l?"Já faz "+n+" dias desde o último.":"Que tal registrar o ponto de partida?"} Pese, tire as medidas e uma foto.<br><button class="btn" data-t="evo">Fazer check-in</button></div>`;
 return `<small>Próximo check-in em ${14-n} dia(s).</small>`}
function vHoje(){const d=day(),n=M.filter(m=>d.done[m.id]).length,doy=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/864e5);
 let h=`<h1>Guia Alimentar da Bia</h1><small>Um passo de cada vez ♡</small><div class="hero"><small>Frase do dia</small><p>${Q[doy%Q.length]}</p></div>${remind()}
 <div style="margin:12px 0"><small>${n} de ${M.length} refeições feitas hoje</small><div class="bar"><i style="width:${n/M.length*100}%"></i></div></div>`;
 M.forEach(m=>{h+=`<section class="card ${d.done[m.id]?"done":""}"><div class="mh"><button class="chk" data-m="${m.id}" aria-label="Marcar refeição">${d.done[m.id]?"✓":""}</button><div><b>${m.t}</b><small>${m.h} · ${m.k}</small></div></div><div class="ings">`;
  m.i.forEach((x,j)=>{const id=m.id+j,s=d.sub[id],lab=s||(x[1]+(x[2]?" · "+x[2]:""));
   h+=x[0]?`<button class="ing ${s?"sw":""}" data-i="${id}" data-g="${x[0]}" data-k="${x[3]||0}">${lab}<span>⇄</span></button>`:`<span class="ing fx">${lab}</span>`});
  h+=`</div></section>`});
 return h+`<p class="mut" style="font-size:12px">Referência do dia: ≈1.350–1.450 kcal e cerca de 100 g de proteína. Caminhe 30–40 min, 5x por semana. Toque em um ingrediente para ver as trocas equivalentes. Material orientativo, não substitui nutricionista ou médico.</p>`}
function vAgua(){const w=S.water[td()]||0,p=Math.min(100,w/S.goal*100);
 let wk="";for(let k=6;k>=0;k--){const dt=new Date();dt.setDate(dt.getDate()-k);const v=S.water[ds(dt)]||0;wk+=`<div><i style="height:${Math.min(100,v/S.goal*100)*.7}px"></i>${["D","S","T","Q","Q","S","S"][dt.getDay()]}</div>`}
 return `<h1>Água</h1><div class="hero" style="text-align:center"><div style="font:600 40px Georgia,serif">${(w/1000).toFixed(2).replace(".",",")} L</div><small>meta: ${(S.goal/1000).toFixed(1).replace(".",",")} L${w>=S.goal?" · meta batida! 🎉":""}</small><div class="bar" style="margin-top:10px"><i style="width:${p}%"></i></div></div>
 <div class="row"><button class="btn" data-w="150">+150 ml</button><button class="btn" data-w="200">+200 ml</button></div><div class="row"><button class="btn" data-w="300">+300 ml</button><button class="btn" data-w="500">+500 ml</button></div>
 <div class="row"><button class="btn g" data-w="-200">Desfazer 200 ml</button><button class="btn g" data-w="0">Zerar hoje</button></div>
 <div class="card"><b>Últimos 7 dias</b><div class="wk" style="margin-top:8px">${wk}</div></div>
 <div class="card"><label>Meta diária (ml)</label><input type="number" inputmode="numeric" value="${S.goal}" data-f="goal"></div>`}
function chart(){const a=S.log.filter(x=>x.p);if(a.length<2)return`<small>O gráfico aparece com 2 ou mais registros de peso.</small>`;
 const mn=Math.min(...a.map(x=>x.p))-1,mx=Math.max(...a.map(x=>x.p))+1,pts=a.map((x,i)=>[10+i*(300/(a.length-1)),10+(mx-x.p)/(mx-mn)*90]);
 return `<svg viewBox="0 0 320 120"><polyline fill="none" stroke="var(--ac)" stroke-width="3" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--ac)"/>`).join("")}<text x="4" y="118" font-size="10" fill="var(--mut)">${mn.toFixed(0)}–${mx.toFixed(0)} kg</text></svg>`}
function vEvo(){const L=[...S.log].reverse(),last=S.log.filter(x=>x.p).pop();
 const imc=last&&S.altura?(last.p/Math.pow(S.altura/100,2)).toFixed(1).replace(".",","):"–";
 return `<h1>Minha evolução</h1><small>Check-in a cada 15 dias</small>
 <div class="card"><div class="row"><div><label>Altura (cm)</label><input type="number" inputmode="decimal" value="${S.altura}" data-f="altura"></div><div><label>Peso ideal (kg)</label><input type="number" inputmode="decimal" value="${S.ideal}" data-f="ideal"></div></div><small>IMC atual: ${imc}${S.ideal&&last?" · faltam "+Math.abs(last.p-S.ideal).toFixed(1).replace(".",",")+" kg para o ideal":""}</small></div>
 <div class="card"><b>Novo check-in</b><div class="row"><div><label>Peso (kg)</label><input id="p" type="number" inputmode="decimal"></div><div><label>Cintura (cm)</label><input id="c" type="number" inputmode="decimal"></div></div>
 <div class="row"><div><label>Quadril (cm)</label><input id="q" type="number" inputmode="decimal"></div><div><label>Braço (cm)</label><input id="b" type="number" inputmode="decimal"></div><div><label>Coxa (cm)</label><input id="t" type="number" inputmode="decimal"></div></div>
 <label>Foto (opcional)</label><input id="ft" type="file" accept="image/*"><div class="row"><button class="btn" data-add="1">Salvar check-in</button></div></div>
 <div class="card"><b>Peso ao longo do tempo</b>${chart()}</div>
 <div class="card"><b>Histórico</b>${L.length?L.map(x=>{const i=S.log.indexOf(x),pv=S.log.slice(0,i).filter(y=>y.p).pop(),dl=x.p&&pv?(x.p-pv.p):null;
  return `<div class="ent">${x.f?`<img src="${x.f}" alt="">`:""}<div><b>${fmt(x.d)}${x.p?" · "+x.p+" kg":""}</b>${dl!==null?` <small>(${dl>0?"+":""}${dl.toFixed(1)})</small>`:""}<br><small>${[x.c&&"cintura "+x.c,x.q&&"quadril "+x.q,x.b&&"braço "+x.b,x.t&&"coxa "+x.t].filter(Boolean).join(" · ")}</small></div><button class="btn g" data-del="${i}">✕</button></div>`}).join(""):"<small>Nenhum registro ainda.</small>"}</div>
 <p class="mut" style="font-size:12px">Os dados ficam salvos só neste aparelho. Se sentir tontura, fraqueza persistente ou mal-estar, procure orientação profissional.</p>`}
function render(){$("#app").innerHTML=tab=="hoje"?vHoje():tab=="agua"?vAgua():vEvo();document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab))}
function sheet(id,g,k){const d=day(),[nm,ops0]=G[g],st=g=="gord"?1:5,ops=ops0.map(o=>typeof o[1]=="number"?[o[0],Math.max(st,Math.round(k/o[1]*100/st)*st)+" "+(o[2]||"g")+" · ≈"+k+" kcal"]:o);$("#shc").innerHTML=`<b>Trocas: ${nm}</b><br><small>${k?"Todas as opções rendem ≈"+k+" kcal, como o item atual. ":""}Troque sem somar ao original.</small>`+ops.map(o=>`<button class="op" data-s="${id}" data-v="${o[0]} · ${o[1]}"><span>${o[0]}</span><small>${o[1]}</small></button>`).join("")+(d.sub[id]?`<button class="op" data-s="${id}" data-v="" style="color:var(--ac)">↩ Voltar ao original</button>`:"")+`<div class="row"><button class="btn g" data-x="1">Fechar</button></div>`;$("#sh").classList.add("on")}
document.addEventListener("click",e=>{const b=e.target.closest("button,#sh");if(!b)return;const D=b.dataset;
 if(b.id=="sh"&&e.target.id=="sh"){$("#sh").classList.remove("on");return}
 if(D.t){tab=D.t;render();scrollTo(0,0)}
 else if(D.m){const d=day();d.done[D.m]=!d.done[D.m];sv();render()}
 else if(D.i)sheet(D.i,D.g,+D.k||0);
 else if(D.s!==undefined){const d=day();if(D.v)d.sub[D.s]=D.v;else delete d.sub[D.s];sv();$("#sh").classList.remove("on");render()}
 else if(D.x)$("#sh").classList.remove("on");
 else if(D.w!==undefined){const k=td(),v=+D.w;S.water[k]=v==0?0:Math.max(0,(S.water[k]||0)+v);sv();render()}
 else if(D.del){if(confirm("Apagar este registro?")){S.log.splice(+D.del,1);sv();render()}}
 else if(D.add){const g=i=>$("#"+i).value.trim(),e2={d:td(),p:+g("p")||"",c:g("c"),q:g("q"),b:g("b"),t:g("t"),f:foto};
  if(!e2.p&&!e2.c&&!e2.q&&!e2.b&&!e2.t&&!e2.f){alert("Preencha ao menos um campo.");return}
  S.log.push(e2);S.log.sort((a,b)=>a.d<b.d?-1:1);foto="";sv();render()}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.f){S[t.dataset.f]=+t.value||(t.dataset.f=="ideal"?"":S[t.dataset.f]);sv();render()}
 if(t.id=="ft"&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=480/Math.max(im.width,im.height,480);c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);foto=c.toDataURL("image/jpeg",.6)};im.src=r.result};r.readAsDataURL(t.files[0])}});
render();
</script></body></html>
